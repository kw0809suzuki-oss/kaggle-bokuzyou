name: Adaptive Replay Commitment Reserve v0
on:
  push:
    branches: ["experiment/adaptive-replay-alt-cash-preservation-v0-20260930"]
    paths:
      - "adaptive_replay_commitment_reserve_v0.py"
      - "run_adaptive_replay_commitment_reserve_v0_fixed20.py"
      - ".github/workflows/adaptive-replay-commitment-reserve-v0.yml"
permissions:
  contents: read
jobs:
  paired-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - run: python run_adaptive_replay_commitment_reserve_v0_fixed20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-commitment-reserve-v0-fixed20
          path: adaptive_replay_commitment_reserve_v0_fixed20_result.json
          if-no-files-found: warn
