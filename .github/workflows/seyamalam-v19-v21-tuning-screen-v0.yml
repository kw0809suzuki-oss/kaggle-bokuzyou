name: Seyamalam V19 vs V21 Tuning Screen v0

on:
  push:
    branches:
      - "experiment/seyamalam-imitation-v0-20260927"
    paths:
      - "run_seyamalam_v19_v21_pair_v0.py"
      - ".github/workflows/seyamalam-v19-v21-tuning-screen-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        seed: [92801101, 92801102, 92801103, 92801104, 92801105]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned V19, V21, and current V21 opponent
        run: |
          mkdir -p teacher_candidates
          base=https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72
          curl -fL --retry 3 -o teacher_candidates/main_v21.py "$base/main.py"
          curl -fL --retry 3 -o teacher_candidates/candidate_v19_wool_floor.py "$base/agents/candidate_v19_wool_floor.py"
          curl -fL --retry 3 -o teacher_candidates/candidate_v21_capital_latch.py "$base/agents/candidate_v21_capital_latch.py"

      - name: Run paired seed
        run: |
          python run_seyamalam_v19_v21_pair_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seyamalam-v19-v21-seed-${{ matrix.seed }}
          path: seyamalam_v19_v21_pair_seed${{ matrix.seed }}.json
          if-no-files-found: warn
