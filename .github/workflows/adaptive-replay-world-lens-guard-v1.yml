name: Adaptive Replay World Lens Guard v1
on:
  push:
    branches:
      - "submission/adaptive-replay-world-lens-guard-v1-20260930"
    paths:
      - "adaptive_replay_world_lens_guard_v1.py"
      - "run_adaptive_replay_world_lens_guard_v1.py"
      - ".github/workflows/adaptive-replay-world-lens-guard-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run fixed10 equivalence
        run: python run_adaptive_replay_world_lens_guard_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-world-lens-guard-v1-equivalence
          path: adaptive_replay_world_lens_guard_v1_equivalence.json
          if-no-files-found: warn
