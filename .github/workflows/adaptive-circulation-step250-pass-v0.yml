name: Adaptive Circulation Step250 PASS v0

on:
  push:
    branches:
      - "experiment/adaptive-circulation-step250-pass-v0-20260930"
    paths:
      - "adaptive_circulation_step250_pass_v0.py"
      - "run_adaptive_circulation_step250_pass_v0.py"
      - ".github/workflows/adaptive-circulation-step250-pass-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed10:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run WATER PASS HARVEST fixed10
        run: python run_adaptive_circulation_step250_pass_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-circulation-step250-pass-v0
          path: adaptive_circulation_step250_pass_v0_result.json
          if-no-files-found: warn
