name: Strong Public Opponent Sellesta v0

on:
  push:
    branches:
      - "observer/strong-public-opponent-sellesta-v0-20260927"
    paths:
      - "run_strong_public_opponent_sellesta_v0.py"
      - ".github/workflows/strong-public-opponent-sellesta-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        seed: [92801801, 92801802, 92801803]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned Sellesta public agent
        run: |
          mkdir -p opponents
          curl -L --fail --silent --show-error \
            "https://raw.githubusercontent.com/Sellesta/Kaggriculture/0a5ce7ef83211d6df5824a4e7e17f3d4a40c22e7/main.py" \
            -o opponents/sellesta_main_pinned.py
          sha256sum opponents/sellesta_main_pinned.py
          python -m py_compile opponents/sellesta_main_pinned.py

      - name: Run strong public opponent observation
        run: |
          python run_strong_public_opponent_sellesta_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-public-sellesta-seed-${{ matrix.seed }}
          path: |
            strong_public_${{ matrix.seed }}_summary.json
            strong_public_${{ matrix.seed }}_*.json.gz
          if-no-files-found: warn
