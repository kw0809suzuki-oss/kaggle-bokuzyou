name: Minimal Terminal Candidate Fresh20

on:
  push:
    branches:
      - "experiment/minimal-terminal-candidate-v0-20260927"
    paths:
      - ".github/workflows/minimal-terminal-candidate-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh20:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3 \
            -o opponents/seyamalam_v21.py \
            https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py

      - name: Run fixed Fresh20 from scratch
        run: python run_minimal_terminal_candidate_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-terminal-candidate-v0-result
          path: minimal_terminal_candidate_v0_result.json
          if-no-files-found: ignore
