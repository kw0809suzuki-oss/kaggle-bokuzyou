name: Opponent Course Observation v0

on:
  push:
    branches:
      - "experiment/cash-return-driving-v0-20260927"
    paths:
      - "run_opponent_course_observation_v0.py"
      - ".github/workflows/opponent-course-observation-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3 \
            -o opponents/seyamalam_v21.py \
            https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py

      - name: Observe opponent course
        run: |
          python run_opponent_course_observation_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opponent-course-seed92801101
          path: opponent_course_seed92801101.json
          if-no-files-found: warn
