name: Trajectory Policy Bundles v0

on:
  push:
    branches:
      - "experiment/trajectory-policy-bundles-v0"
    paths:
      - "run_trajectory_policy_bundles_v0.py"
      - ".github/workflows/trajectory-policy-bundles-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kw0809suzuki-oss/relation-flow-agent
          ref: observer/wr02-value-carry-reanchor-v0-20260925
          path: selfsrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run trajectory policy fresh10 screen
        run: python run_trajectory_policy_bundles_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-policy-bundles-v0
          path: trajectory_policy_bundles_v0.json
