name: Dual Trace Battle

on:
  push:
    branches: ["main"]
    paths:
      - "run_dual_trace.py"
      - ".github/workflows/dual-trace.yml"
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kw0809suzuki-oss/relation-flow-agent
          ref: 5d8a01a218b5766528580b9bb88d842b7e8951be
          path: selfsrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run dual-trace Battle
        run: python run_dual_trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: dual-trace-seed7001
          path: dual_trace_seed7001.json
