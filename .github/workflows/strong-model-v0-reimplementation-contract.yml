name: Strong Model v0 Reimplementation Contract

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/strong-model-v0-reimplementation-20260928
    paths:
      - 'strong_model_v0_reimplementation/**'
      - 'run_strong_model_v0_reimplementation_contract.py'
      - '.github/workflows/strong-model-v0-reimplementation-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile             strong_model_v0_reimplementation/jobs.py             strong_model_v0_reimplementation/planner.py             strong_model_v0_reimplementation/agent.py             run_strong_model_v0_reimplementation_contract.py

      - name: Strong Model contract
        run: python run_strong_model_v0_reimplementation_contract.py
