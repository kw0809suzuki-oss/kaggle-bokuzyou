name: Light HIRE Pulse One Shot

on:
  push:
    branches:
      - "experiment/light-hire-pulse-v0-20260929"
    paths:
      - "strong_model_v0_reimplementation/**"
      - ".github/workflows/light-hire-pulse-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Syntax check
        run: |
          python -m py_compile strong_model_v0_reimplementation/planner.py strong_model_v0_reimplementation/agent.py strong_model_v0_reimplementation/run_hire_pulse_one_shot.py
      - name: Run one battle
        run: python strong_model_v0_reimplementation/run_hire_pulse_one_shot.py
