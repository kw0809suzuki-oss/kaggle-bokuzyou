name: Idle Recovery Single Shot World Gate v1

on:
  push:
    branches:
      - "experiment/idle-recovery-single-shot-world-gate-v1-20260929"
    paths:
      - "run_idle_recovery_single_shot_world_gate_v1.py"
      - ".github/workflows/idle-recovery-single-shot-world-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile run_terminal_return_world_gate_v0.py run_idle_recovery_single_shot_world_gate_v1.py

      - name: Run idle recovery single-shot World gate
        run: python run_idle_recovery_single_shot_world_gate_v1.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-recovery-single-shot-world-gate-v1
          path: idle_recovery_single_shot_world_gate_v1_result.json
          if-no-files-found: warn

      - name: Commit probe result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idle_recovery_single_shot_world_gate_v1_result.json
          git diff --cached --quiet && exit 0
          git commit -m "result: idle recovery single-shot world gate"
          git push
