name: Pruning First Sign-Separating Divergence v0

on:
  push:
    branches:
      - experiment/pruning-first-sign-separating-divergence-v0-20260930
    paths:
      - run_pruning_first_sign_separating_divergence_v0.py
      - .github/workflows/pruning-first-sign-separating-divergence-v0.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade pip >/dev/null
          pip install "kaggle-environments>=1.32.7" >/dev/null
      - run: python -m py_compile run_pruning_first_sign_separating_divergence_v0.py
      - run: python run_pruning_first_sign_separating_divergence_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: pruning-first-sign-separating-divergence-v0
          path: pruning_first_sign_separating_divergence_v0.json
          if-no-files-found: error
