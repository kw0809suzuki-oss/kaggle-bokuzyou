name: World Lens Agent v0 fixed10
on:
  push:
    branches:
      - "experiment/world-lens-agent-v0-20260930"
    paths:
      - "world_lens_agent_v0.py"
      - "run_world_lens_agent_v0.py"
      - ".github/workflows/world-lens-agent-v0-fixed10.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run World Lens v0 fixed10
        run: python run_world_lens_agent_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-lens-agent-v0-fixed10
          path: world_lens_agent_v0_fixed10.json
          if-no-files-found: warn
