name: DECEM Source Step34 Market Probe v0
on:
  push:
    branches: ["model/replay-distilled-decem-157026-v0-20260930"]
    paths:
      - "run_decem_source_step34_market_probe_v0.py"
      - ".github/workflows/decem-source-step34-market-probe-v0.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - run: python run_decem_source_step34_market_probe_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decem-source-step34-market
          path: decem_source_step34_market_v0.json
          if-no-files-found: warn
