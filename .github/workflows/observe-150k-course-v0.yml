name: Observe 150k Course v0

on:
  push:
    branches:
      - "observer/150k-course-exact-v0-20260927"
    paths:
      - "astra_flow_independent_distilled_v0.py"
      - "run_course_150k_observation_v0.py"
      - ".github/workflows/observe-150k-course-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch exact pinned Teacher and WHEAT opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_self.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
          curl -fL --retry 3             -o cash_return_wheat_v0.py             https://raw.githubusercontent.com/kw0809suzuki-oss/kaggle-bokuzyou/5278b25325d119ed71372c137e418d4a17fb37b2/cash_return_wheat_v0.py
          curl -fL --retry 3             -o plan_generator_entrance_v0.py             https://raw.githubusercontent.com/kw0809suzuki-oss/kaggle-bokuzyou/5278b25325d119ed71372c137e418d4a17fb37b2/plan_generator_entrance_v0.py
          curl -fL --retry 3             -o short_plan_action_projector_v0.py             https://raw.githubusercontent.com/kw0809suzuki-oss/kaggle-bokuzyou/5278b25325d119ed71372c137e418d4a17fb37b2/short_plan_action_projector_v0.py

      - name: Run 150k course observation
        run: |
          python run_course_150k_observation_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-150k-seed-92801101
          path: |
            course_150k_summary.json
            course_150k_full.json.gz
          if-no-files-found: warn
