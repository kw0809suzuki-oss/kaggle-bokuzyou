name: Observe 150k Course v0

on:
  push:
    branches:
      - "observer/150k-course-exact-v0-20260927"
    paths:
      - "astra_flow_independent_distilled_v0.py"
      - "run_course_150k_observation_v0.py"
      - ".github/workflows/observe-150k-course-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Run 150k course observation
        run: |
          python run_course_150k_observation_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-150k-seed-92801101
          path: |
            course_150k_summary.json
            course_150k_full.json.gz
          if-no-files-found: warn
