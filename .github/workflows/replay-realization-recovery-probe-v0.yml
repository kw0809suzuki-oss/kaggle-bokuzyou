name: Replay Realization Recovery Probe v0
on:
  push:
    branches: ["experiment/replay-realization-recovery-probe-v0-20260930"]
    paths:
      - "run_replay_realization_recovery_probe_v0.py"
      - "replay_realization_fixture_v0_part*.txt"
      - ".github/workflows/replay-realization-recovery-probe-v0.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run Replay Realization Recovery Probe v0
        run: python run_replay_realization_recovery_probe_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-realization-recovery-probe-v0
          path: replay_realization_recovery_probe_v0_result.json
          if-no-files-found: warn
