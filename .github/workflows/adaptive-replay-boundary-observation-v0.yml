name: Adaptive Replay Boundary Observation v0
on:
  push:
    branches: ["experiment/adaptive-replay-boundary-observation-v0-20260930"]
    paths:
      - "run_adaptive_replay_boundary_observation_v0.py"
      - "adaptive_replay_contract_runtime_v0.py"
      - "adaptive_replay_effect_contracts_v0.json"
      - "adaptive_replay_world_adapter_v0.py"
      - ".github/workflows/adaptive-replay-boundary-observation-v0.yml"
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run boundary observation
        run: python run_adaptive_replay_boundary_observation_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-boundary-observation-v0
          path: adaptive_replay_boundary_observation_v0.json
          if-no-files-found: warn
