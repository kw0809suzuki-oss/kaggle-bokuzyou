name: First Cash Return Window v0

on:
  push:
    branches:
      - "observer/first-cash-return-window-v0-20260926"
    paths:
      - "run_first_cash_return_window_v0.py"
      - ".github/workflows/first-cash-return-window-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Compare whole-farm paths to first Cash return
        run: python run_first_cash_return_window_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-cash-return-window-v0
          path: first_cash_return_window_v0.json
