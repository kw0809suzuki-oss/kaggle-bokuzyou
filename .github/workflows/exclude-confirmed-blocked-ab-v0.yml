name: Exclude Confirmed Blocked AB v0

on:
  push:
    branches:
      - "experiment/exclude-confirmed-blocked-v0"
    paths:
      - "run_exclude_confirmed_blocked_ab_v0.py"
      - ".github/workflows/exclude-confirmed-blocked-ab-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run blocked-selection A/B
        run: python run_exclude_confirmed_blocked_ab_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exclude-confirmed-blocked-ab-v0
          path: exclude_confirmed_blocked_ab_v0.json
