name: Strong Selection State Parity Gate v0

on:
  push:
    branches:
      - "experiment/terminal-return-world-gate-v0-20260929"
    paths:
      - "run_strong_selection_state_parity_gate_v0.py"
      - ".github/workflows/strong-selection-state-parity-gate-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile             strong_model_v0_reimplementation/jobs.py             strong_model_v0_reimplementation/planner.py             strong_model_v0_reimplementation/agent.py             run_strong_selection_state_parity_gate_v0.py

      - name: Run selection-state parity gate
        run: python run_strong_selection_state_parity_gate_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-selection-state-parity-gate-v0
          path: strong_selection_state_parity_gate_v0_result.json
          if-no-files-found: warn
