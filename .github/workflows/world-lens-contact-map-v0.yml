name: World Lens Contact Map v0
on:
  push:
    branches:
      - "experiment/world-lens-contact-map-v0-20260930"
    paths:
      - "run_world_lens_contact_map_v0.py"
      - ".github/workflows/world-lens-contact-map-v0.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run world lens contact map
        run: python run_world_lens_contact_map_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-lens-contact-map-v0
          path: world_lens_contact_map_v0_result.json
          if-no-files-found: warn
