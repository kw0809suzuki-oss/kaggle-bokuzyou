name: Remaining Plan Connectors v0

on:
  push:
    branches:
      - "experiment/remaining-plan-connectors-v0"
    paths:
      - "short_plan_action_projector_v0.py"
      - "run_remaining_plan_connectors_v0.py"
      - ".github/workflows/remaining-plan-connectors-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kw0809suzuki-oss/relation-flow-agent
          ref: observer/wr02-value-carry-reanchor-v0-20260925
          path: selfsrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run sale and plant connector observations
        run: python run_remaining_plan_connectors_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-plan-connectors-v0
          path: remaining_plan_connectors_v0.json
