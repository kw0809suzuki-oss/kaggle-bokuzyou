name: Strong Initial HIRE2 v0

on:
  push:
    branches:
      - "experiment/strong-initial-hire2-v0-20260929"
    paths:
      - "strong_model_v0_reimplementation/run_initial_hire2_v0.py"
      - ".github/workflows/strong-model-v0-reimplementation-battle-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Syntax check
        run: python -m py_compile strong_model_v0_reimplementation/run_initial_hire2_v0.py
      - name: Run direct HIRE2 Battle
        run: python strong_model_v0_reimplementation/run_initial_hire2_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-initial-hire2-v0
          path: strong_model_v0_reimplementation/initial_hire2_v0_result.json
          if-no-files-found: warn
