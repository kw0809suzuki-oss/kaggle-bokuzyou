name: Yield Output Observation v0

on:
  push:
    branches:
      - "experiment/yield-output-observation-v0"
    paths:
      - "run_yield_output_observation_v0.py"
      - ".github/workflows/yield-output-observation-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run yield output observation
        run: python run_yield_output_observation_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yield-output-observation-v0
          path: yield_output_observation_v0.json
