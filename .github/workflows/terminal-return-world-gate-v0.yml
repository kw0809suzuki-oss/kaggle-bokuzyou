name: Terminal Return World Gate v0

on:
  push:
    branches:
      - "experiment/terminal-return-world-gate-v0-20260929"
    paths:
      - "run_terminal_return_world_gate_v0.py"
      - ".github/workflows/terminal-return-world-gate-v0.yml"
      - "docs/terminal_return_world_gate_v0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile             strong_model_v0_reimplementation/jobs.py             strong_model_v0_reimplementation/planner.py             strong_model_v0_reimplementation/agent.py             run_terminal_return_world_gate_v0.py

      - name: Run one-variant 24-step World gate
        run: python run_terminal_return_world_gate_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-return-world-gate-v0
          path: terminal_return_world_gate_v0_result.json
          if-no-files-found: warn

# rerun after import fix
