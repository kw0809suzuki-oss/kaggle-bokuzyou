name: Dynamic Model Collision Probe v0

on:
  push:
    branches:
      - "experiment/dynamic-model-collision-probe-v0-20260928"
    paths:
      - "run_dynamic_model_collision_probe_v0.py"
      - ".github/workflows/dynamic-model-collision-probe-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned Sellesta public agent
        run: |
          mkdir -p opponents
          curl -L --fail --silent --show-error \
            "https://raw.githubusercontent.com/Sellesta/Kaggriculture/0a5ce7ef83211d6df5824a4e7e17f3d4a40c22e7/main.py" \
            -o opponents/sellesta_main_pinned.py
          python -m py_compile opponents/sellesta_main_pinned.py

      - name: Compile probe
        run: |
          python -m py_compile run_dynamic_model_collision_probe_v0.py

      - name: Run 3-seed seat-swapped collision probe
        run: |
          python run_dynamic_model_collision_probe_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-model-collision-probe-v0
          path: |
            dynamic_model_probe_summary.json
            dynamic_model_probe_*.json.gz
          if-no-files-found: warn
