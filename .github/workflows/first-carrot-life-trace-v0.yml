name: First CARROT Life Trace v0

on:
  push:
    branches:
      - "experiment/first-carrot-life-trace-v0"
    paths:
      - "plan_generator_entrance_v0.py"
      - "short_plan_action_projector_v0.py"
      - "run_first_carrot_life_trace_v0.py"
      - ".github/workflows/first-carrot-life-trace-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Trace first CARROT life
        run: python run_first_carrot_life_trace_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-carrot-life-trace-v0
          path: first_carrot_life_trace_v0.json
