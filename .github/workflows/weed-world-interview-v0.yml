name: Weed World Interview v0

on:
  push:
    branches:
      - "experiment/weed-world-interview-v0"
    paths:
      - "run_weed_world_interview_v0.py"
      - ".github/workflows/weed-world-interview-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run world interview
        run: python run_weed_world_interview_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weed-world-interview-v0
          path: weed_world_interview_v0.json
