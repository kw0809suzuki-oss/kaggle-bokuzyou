name: Adaptive Circulation Opportunity v0 Fixed10

on:
  push:
    branches:
      - "experiment/adaptive-circulation-opportunity-v0-20260930"
    paths:
      - "adaptive_circulation_opportunity_v0.py"
      - "run_adaptive_circulation_opportunity_v0_fixed10.py"
      - ".github/workflows/adaptive-circulation-opportunity-v0-fixed10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run fixed10 A/B
        run: python run_adaptive_circulation_opportunity_v0_fixed10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-circulation-opportunity-v0-fixed10
          path: adaptive_circulation_opportunity_v0_fixed10.json
          if-no-files-found: warn
