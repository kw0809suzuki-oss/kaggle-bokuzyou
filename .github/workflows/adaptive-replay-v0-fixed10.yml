name: Adaptive Replay v0 Fixed10 Gate
on:
  push:
    branches: ["experiment/adaptive-replay-v0-20260930"]
    paths:
      - "adaptive_replay_v0.py"
      - "run_adaptive_replay_v0_fixed10.py"
      - "experiments/adaptive_replay_v0_design.json"
      - ".github/workflows/adaptive-replay-v0-fixed10.yml"
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run fixed10 A/B gate
        run: python run_adaptive_replay_v0_fixed10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-v0-fixed10
          path: adaptive_replay_v0_fixed10_gate.json
          if-no-files-found: warn
