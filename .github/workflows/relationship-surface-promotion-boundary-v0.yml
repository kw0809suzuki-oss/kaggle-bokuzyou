name: Relationship Surface Promotion Boundary v0

on:
  push:
    branches:
      - "validation/relationship-surface-promotion-boundary-v0-20260926"
    paths:
      - "run_relationship_surface_promotion_boundary_v0.py"
      - ".github/workflows/relationship-surface-promotion-boundary-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run Promotion Boundary Probe v0
        run: python run_relationship_surface_promotion_boundary_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relationship-surface-promotion-boundary-v0
          path: relationship_surface_promotion_boundary_v0.json
