name: Remaining Return Variants Gate v0

on:
  push:
    branches:
      - "experiment/remaining-return-variants-gate-v0-20260929"
    paths:
      - "strong_model_v0_reimplementation/run_terminal_return_parallel_v0.py"
      - ".github/workflows/remaining-return-variants-gate-v0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile strong_model_v0_reimplementation/run_terminal_return_parallel_v0.py

      - name: Run remaining variants gate
        run: python strong_model_v0_reimplementation/run_terminal_return_parallel_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-return-variants-gate-v0
          path: strong_model_v0_reimplementation/terminal_return_parallel_v0_result.json
          if-no-files-found: warn

      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strong_model_v0_reimplementation/terminal_return_parallel_v0_result.json
          git diff --cached --quiet && exit 0
          git commit -m "result: remaining return variants world gate"
          git push
