name: Validate Original H180 NoStress

on:
  push:
    branches:
      - submission/return-aware-v0-original-h180-nostress-20260930
    paths:
      - .github/workflows/validate-original-h180-nostress.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install "kaggle-environments>=1.32.7" >/dev/null
      - name: Validate and package
        run: |
          cp kaggle_submission_return_aware_v0/submission.py main.py
          python -m py_compile main.py
          python - <<'PY'
          import time
          from kaggle_environments import make
          env=make("kaggriculture",configuration={"episodeSteps":720},debug=False)
          t=time.perf_counter()
          env.run(["main.py","main.py"])
          elapsed=time.perf_counter()-t
          final=env.steps[-1]
          print("ELAPSED",elapsed)
          print("FINAL",[(i,s.reward,str(s.status)) for i,s in enumerate(final)])
          assert all(str(s.status)=="DONE" for s in final)
          PY
          tar -czf kaggriculture_return_aware_v0_original_h180_nostress.tar.gz main.py
          sha256sum kaggriculture_return_aware_v0_original_h180_nostress.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-return-aware-v0-original-h180-nostress
          path: kaggriculture_return_aware_v0_original_h180_nostress.tar.gz
          if-no-files-found: error
