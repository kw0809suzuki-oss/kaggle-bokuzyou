name: Current-World Relationship Fresh10 Validation v0

on:
  push:
    branches:
      - "validation/current-world-relationship-fresh-v0-20260926"
    paths:
      - ".github/workflows/current-world-relationship-fresh10-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh10:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGRI_ENV_SEEDS: "7102,7103,7104,7105,7106,7107,7108,7109,7110,7111"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run fresh10 with unchanged dual-layer instrument
        run: python run_current_world_relationship_fresh_validation_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-world-relationship-fresh10-v0
          path: current_world_relationship_fresh_validation_v0.json
