name: World Divergence Decision Trace v0

on:
  push:
    branches:
      - "experiment/world-divergence-decision-trace-v0-20260929"
    paths:
      - "run_world_divergence_decision_trace_v0.py"
      - "test_world_divergence_decision_trace_runner_v0.py"
      - ".github/workflows/world-divergence-decision-trace-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile             run_world_divergence_decision_trace_v0.py             test_world_divergence_decision_trace_runner_v0.py

      - name: Runner helper contract
        run: python test_world_divergence_decision_trace_runner_v0.py

      - name: Run fixed HIRE2 world divergence decision trace
        run: python run_world_divergence_decision_trace_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-divergence-decision-trace-v0
          path: world_divergence_decision_trace_v0_result.json
          if-no-files-found: warn
