name: Independent Day0 MELON12 v0

on:
  push:
    branches:
      - "experiment/independent-day0-melon12-v0-20260927"
    paths:
      - "independent_day0_melon12_v0.py"
      - "run_independent_day0_melon12_v0.py"
      - ".github/workflows/independent-day0-melon12-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        seed: [92801801, 92801802, 92801803]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned Sellesta public agent
        run: |
          mkdir -p opponents
          curl -L --fail --silent --show-error \
            "https://raw.githubusercontent.com/Sellesta/Kaggriculture/0a5ce7ef83211d6df5824a4e7e17f3d4a40c22e7/main.py" \
            -o opponents/sellesta_main_pinned.py
          sha256sum opponents/sellesta_main_pinned.py
          python -m py_compile opponents/sellesta_main_pinned.py

      - name: Compile candidate and runner
        run: |
          python -m py_compile independent_day0_melon12_v0.py
          python -m py_compile run_independent_day0_melon12_v0.py

      - name: Run reachability then paired terminal comparison
        run: |
          python run_independent_day0_melon12_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-melon12-seed-${{ matrix.seed }}
          path: melon12_seed${{ matrix.seed }}_summary.json
          if-no-files-found: warn
