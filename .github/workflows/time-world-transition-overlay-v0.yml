name: Time World Transition Overlay v0

on:
  push:
    branches:
      - "observer/time-world-transition-overlay-v0-20260926"
    paths:
      - "run_time_world_transition_overlay_v0.py"
      - ".github/workflows/time-world-transition-overlay-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Overlay time allocation with Official World transitions
        run: python run_time_world_transition_overlay_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-world-transition-overlay-v0
          path: time_world_transition_overlay_v0.json
