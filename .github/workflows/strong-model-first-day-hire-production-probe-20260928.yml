name: Strong Model first-day hire production probe

on:
  push:
    branches:
      - experiment/strong-model-first-day-hire-production-probe-20260928
    paths:
      - 'experiments/strong_model_first_day_hire_production_probe_20260928/**'
      - '.github/workflows/strong-model-first-day-hire-production-probe-20260928.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Run replay-aligned probe
        run: python experiments/strong_model_first_day_hire_production_probe_20260928/run_probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-model-first-day-hire-production-probe
          path: experiments/strong_model_first_day_hire_production_probe_20260928/result.json
          if-no-files-found: warn
