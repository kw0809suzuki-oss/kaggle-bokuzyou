name: Whole Farm Observation v0

on:
  push:
    branches:
      - "experiment/whole-farm-observation-v0"
    paths:
      - "confirmed_circulation_body_v0.json"
      - "run_whole_farm_observation_v0.py"
      - ".github/workflows/whole-farm-observation-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3             -o opponents/seyamalam_v21.py             https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py
      - name: Run Whole Farm Observation
        run: python run_whole_farm_observation_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-farm-observation-v0
          path: whole_farm_observation_v0.json
