name: Kaggriculture smoke test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle environments
        run: python -m pip install -r requirements.txt
      - name: Run official Kaggriculture
        run: python run_kaggriculture.py
