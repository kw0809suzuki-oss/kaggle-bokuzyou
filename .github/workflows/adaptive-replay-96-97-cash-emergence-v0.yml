name: Adaptive Replay 96-97 Cash Emergence v0
on:
  push:
    branches: ["experiment/adaptive-replay-96-97-cash-emergence-v0-20260930"]
    paths:
      - "run_adaptive_replay_96_97_cash_emergence_v0.py"
      - ".github/workflows/adaptive-replay-96-97-cash-emergence-v0.yml"
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run 96-97 cash emergence probe
        run: python run_adaptive_replay_96_97_cash_emergence_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-96-97-cash-emergence-v0
          path: adaptive_replay_96_97_cash_emergence_v0.json
          if-no-files-found: warn
