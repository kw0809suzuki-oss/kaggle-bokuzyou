name: Adaptive Replay Contract Runtime v0 Equivalence
on:
  push:
    branches: ["engineering/adaptive-replay-contract-runtime-v0-20260930"]
    paths:
      - "adaptive_replay_effect_contracts_v0.json"
      - "adaptive_replay_world_adapter_v0.py"
      - "adaptive_replay_contract_runtime_v0.py"
      - "run_adaptive_replay_contract_equivalence_fixed10.py"
      - ".github/workflows/adaptive-replay-contract-runtime-v0-equivalence.yml"
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run fixed10 exact equivalence gate
        run: python run_adaptive_replay_contract_equivalence_fixed10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-contract-runtime-v0-equivalence
          path: adaptive_replay_contract_runtime_v0_equivalence_fixed10.json
          if-no-files-found: warn
