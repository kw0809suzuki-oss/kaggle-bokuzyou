name: MELON12 h22 diagnostic

on:
  push:
    branches:
      - "experiment/independent-day0-melon12-v0-20260927"
    paths:
      - "run_melon12_h22_diagnostic.py"
      - ".github/workflows/melon12-h22-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Fetch pinned Sellesta public agent
        run: |
          mkdir -p opponents
          curl -L --fail --silent --show-error \
            "https://raw.githubusercontent.com/Sellesta/Kaggriculture/0a5ce7ef83211d6df5824a4e7e17f3d4a40c22e7/main.py" \
            -o opponents/sellesta_main_pinned.py
      - name: Run h22 diagnostic
        run: python run_melon12_h22_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melon12-h22-diagnostic
          path: melon12_h22_diagnostic.json
          if-no-files-found: error
