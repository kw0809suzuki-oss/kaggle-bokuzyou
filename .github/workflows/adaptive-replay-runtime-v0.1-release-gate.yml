name: Adaptive Replay Runtime v0.1 Release Gate
on:
  push:
    branches: ["release/adaptive-replay-runtime-v0.1-20260930"]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run v0.1 release gate
        run: python run_adaptive_replay_runtime_v0_1_release_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-replay-runtime-v0.1-release-gate
          path: |
            adaptive_replay_runtime_v0_1_release_gate_result.json
            adaptive_replay_contract_runtime_v0_equivalence_fixed10.json
          if-no-files-found: warn
