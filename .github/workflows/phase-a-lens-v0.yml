name: Phase A Lens v0 Probe

on:
  push:
    branches: ["experiment/phase-a-lens-v0"]
    paths:
      - "phase_a_lens_model_v0.py"
      - "phase_a_blind_cases_v0.json"
      - "run_phase_a_lens_probe_v0.py"
      - ".github/workflows/phase-a-lens-v0.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python run_phase_a_lens_probe_v0.py
