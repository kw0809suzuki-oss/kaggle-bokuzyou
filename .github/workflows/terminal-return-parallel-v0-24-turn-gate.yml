name: Terminal Return Parallel v0 24 Turn Gate

on:
  push:
    branches:
      - "experiment/terminal-return-parallel-v0-20260929"
    paths:
      - "strong_model_v0_reimplementation/**"
      - ".github/workflows/terminal-return-parallel-v0-24-turn-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Syntax check
        run: |
          python -m py_compile strong_model_v0_reimplementation/jobs.py strong_model_v0_reimplementation/planner.py strong_model_v0_reimplementation/agent.py strong_model_v0_reimplementation/run_terminal_return_parallel_v0.py
      - name: Run six variants through 24 turn gate
        run: python strong_model_v0_reimplementation/run_terminal_return_parallel_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-return-parallel-v0-24-turn-gate
          path: strong_model_v0_reimplementation/terminal_return_parallel_v0_result.json
          if-no-files-found: warn
