name: V7 V19 First-Divergence Diagnostic v0

on:
  push:
    branches:
      - "experiment/seyamalam-imitation-v0-20260927"
    paths:
      - "run_v7_v19_first_divergence_diagnostic_v0.py"
      - "experiments/v7_v19_first_divergence_diagnostic_v0.json"
      - ".github/workflows/v7-v19-first-divergence-diagnostic-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        seed: [92801501, 92801502, 92801503, 92801504, 92801505, 92801506, 92801507, 92801508, 92801509, 92801510]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch exact V7, V19, and two V21 opponent copies
        run: |
          mkdir -p teacher_candidates
          base=https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72
          curl -fL --retry 3 -o teacher_candidates/candidate_v7_public_v18.py "$base/agents/candidate_v7_public_v18.py"
          curl -fL --retry 3 -o teacher_candidates/candidate_v19_wool_floor.py "$base/agents/candidate_v19_wool_floor.py"
          curl -fL --retry 3 -o teacher_candidates/main_v21_a.py "$base/main.py"
          cp teacher_candidates/main_v21_a.py teacher_candidates/main_v21_b.py

      - name: Run first-divergence diagnostic
        run: |
          python run_v7_v19_first_divergence_diagnostic_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-v19-first-divergence-seed-${{ matrix.seed }}
          path: v7_v19_first_divergence_seed${{ matrix.seed }}.json
          if-no-files-found: warn
