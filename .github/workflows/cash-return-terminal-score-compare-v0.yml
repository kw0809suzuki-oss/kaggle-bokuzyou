name: Cash Return Terminal Score Compare v0

on:
  push:
    branches:
      - "experiment/cash-return-driving-v0-20260927"
    paths:
      - "run_cash_return_terminal_score_compare_v0.py"
      - ".github/workflows/cash-return-terminal-score-compare-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Fetch pinned Seyamalam opponent
        run: |
          mkdir -p opponents
          curl -fL --retry 3 \
            -o opponents/seyamalam_v21.py \
            https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py

      - name: Compare current terminal scores
        run: |
          python run_cash_return_terminal_score_compare_v0.py
