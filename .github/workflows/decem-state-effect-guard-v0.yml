name: DECEM State-Effect Guard v0 A/B
on:
  push:
    branches: ["model/replay-distilled-decem-157026-v0-20260930"]
    paths:
      - "decem_replay_state_effect_guard_v0.py"
      - "run_decem_state_effect_guard_v0.py"
      - ".github/workflows/decem-state-effect-guard-v0.yml"
permissions:
  contents: read
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        seed: [92802001, 92802002]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - run: python run_decem_state_effect_guard_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decem-state-effect-guard-${{ matrix.seed }}
          path: decem_state_effect_guard_seed${{ matrix.seed }}.json
          if-no-files-found: warn
