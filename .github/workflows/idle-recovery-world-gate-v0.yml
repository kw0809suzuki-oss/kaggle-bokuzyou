name: Idle Recovery World Gate v0

on:
  push:
    branches:
      - "experiment/idle-recovery-world-gate-v0-20260929"
    paths:
      - "run_idle_recovery_world_gate_v0.py"
      - ".github/workflows/idle-recovery-world-gate-v0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Official Kaggriculture World
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Syntax check
        run: |
          python -m py_compile             strong_model_v0_reimplementation/jobs.py             strong_model_v0_reimplementation/planner.py             strong_model_v0_reimplementation/agent.py             strong_model_v0_reimplementation/run_terminal_return_parallel_v0.py             run_idle_recovery_world_gate_v0.py

      - name: Run idle recovery 24-step World gate
        run: python run_idle_recovery_world_gate_v0.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-recovery-world-gate-v0
          path: idle_recovery_world_gate_v0_result.json
          if-no-files-found: warn

      - name: Commit probe result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idle_recovery_world_gate_v0_result.json
          git diff --cached --quiet && exit 0
          git commit -m "result: idle recovery world gate"
          git push
