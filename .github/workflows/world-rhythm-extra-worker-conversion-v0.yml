name: World Rhythm Extra Worker Conversion v0
on:
  push:
    branches: ["experiment/world-rhythm-extra-worker-conversion-v0-20260930"]
    paths:
      - "run_world_rhythm_extra_worker_conversion_v0.py"
      - ".github/workflows/world-rhythm-extra-worker-conversion-v0.yml"
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Run Extra Worker Conversion Probe v0
        run: python run_world_rhythm_extra_worker_conversion_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-rhythm-extra-worker-conversion-v0
          path: world_rhythm_extra_worker_conversion_v0_result.json
          if-no-files-found: warn
