name: Adaptive Circulation Spare Labor Search v0

on:
  push:
    branches:
      - "experiment/adaptive-circulation-opportunity-v0-20260930"
    paths:
      - "run_adaptive_circulation_spare_labor_search_v0.py"
      - ".github/workflows/adaptive-circulation-spare-labor-search-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"
      - name: Search strict spare-labor candidates
        run: python run_adaptive_circulation_spare_labor_search_v0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-circulation-spare-labor-search-v0
          path: adaptive_circulation_spare_labor_search_v0.json
          if-no-files-found: warn
