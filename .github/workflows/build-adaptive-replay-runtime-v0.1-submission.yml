name: Build Adaptive Replay Runtime v0.1 Submission
on:
  push:
    branches: ["packaging/adaptive-replay-runtime-v0.1-submission-20260930"]
    paths:
      - ".github/workflows/build-adaptive-replay-runtime-v0.1-submission.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build single-file main
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          replay = Path("decem_replay_distilled_157026_v0.py").read_text(encoding="utf-8")
          replay = replay.replace("def reset_agent():\n    return None", "def _replay_reset_agent():\n    return None")
          replay = replay.replace("def agent(obs, configuration=None):", "def _replay_agent(obs, configuration=None):", 1)

          contracts = json.loads(Path("adaptive_replay_effect_contracts_v0.json").read_text(encoding="utf-8"))

          suffix = r'''

          _EFFECT_CONTRACT_DOC = __CONTRACT_LITERAL__
          _CONTRACTS = [c for c in _EFFECT_CONTRACT_DOC.get("contracts", []) if c.get("status") == "active"]

          trigger_count = 0
          last_guard_event = None
          last_contract_id = None

          def _runtime_reset_agent():
              global trigger_count, last_guard_event, last_contract_id
              trigger_count = 0
              last_guard_event = None
              last_contract_id = None
              _replay_reset_agent()

          def _fib_hire_cost_unit(nth_hire_today: int) -> int:
              a, b = 1, 1
              for _ in range(max(0, int(nth_hire_today) - 1)):
                  a, b = b, a + b
              return a

          def _count_feasible_hires(*, money: float, hires_today: int, requested: int, cost_mult: float = 1.0) -> int:
              cash = float(money)
              done = 0
              for offset in range(int(requested)):
                  nth = int(hires_today) + offset + 1
                  cost = float(cost_mult) * _fib_hire_cost_unit(nth)
                  if cash < cost:
                      break
                  cash -= cost
                  done += 1
              return done

          def _cost_mult(configuration) -> float:
              if configuration is None:
                  return 1.0
              if isinstance(configuration, dict):
                  return float(configuration.get("farmHandCostMult", 1) or 1)
              return float(getattr(configuration, "farmHandCostMult", 1) or 1)

          def _count_market_operation(market_orders, operation: str) -> int:
              return sum(
                  1 for order in market_orders
                  if isinstance(order, (list, tuple))
                  and len(order) >= 1
                  and order[0] == operation
              )

          def _cap_market_operation_count(market_orders, operation: str, count: int):
              kept = 0
              out = []
              for order in market_orders:
                  is_target = (
                      isinstance(order, (list, tuple))
                      and len(order) >= 1
                      and order[0] == operation
                  )
                  if not is_target:
                      out.append(order)
                      continue
                  if kept < int(count):
                      out.append(order)
                      kept += 1
              return out

          def _apply_contract(action, obs, configuration, contract):
              scope = contract.get("scope", {})
              step = int(obs.get("step", 0) or 0)
              if step != int(scope.get("step", -1)):
                  return action, None

              operation = contract.get("operation")
              market_orders = list(action.get("market", []) or [])
              requested = _count_market_operation(market_orders, operation)
              protected_count = int(contract["protected_effect"]["count"])
              if requested <= protected_count:
                  return action, None

              check = contract.get("world_check", {})
              if check.get("adapter") != "hire_feasibility":
                  return action, None

              player = int(obs.get("player", 0) or 0)
              farm = obs["farms"][player]
              money = float(farm.get("money", 0) or 0)
              hires_today = int(farm.get("hires_today", 0) or 0)

              feasible = _count_feasible_hires(
                  money=money,
                  hires_today=hires_today,
                  requested=requested,
                  cost_mult=_cost_mult(configuration),
              )
              if feasible <= protected_count:
                  return action, None

              transform = contract.get("transform", {})
              if transform.get("kind") != "cap_market_operation_count":
                  return action, None

              transformed = deepcopy(action)
              transformed["market"] = _cap_market_operation_count(
                  market_orders,
                  transform.get("operation", operation),
                  int(transform.get("count", protected_count)),
              )

              event = {
                  "step": step,
                  "money": money,
                  "hires_today": hires_today,
                  "requested_hires": requested,
                  "current_feasible_hires": feasible,
                  "source_realized_hires": protected_count,
              }
              return transformed, event

          def agent(obs, configuration=None):
              global trigger_count, last_guard_event, last_contract_id
              action = deepcopy(_replay_agent(obs, configuration))
              for contract in _CONTRACTS:
                  action, event = _apply_contract(action, obs, configuration, contract)
                  if event is not None:
                      trigger_count += 1
                      last_guard_event = event
                      last_contract_id = contract.get("id")
              return action
          '''
          suffix = suffix.replace("__CONTRACT_LITERAL__", repr(contracts))
          Path("main.py").write_text(replay + suffix, encoding="utf-8")
          PY
          python -m py_compile main.py

      - name: Install pinned Official Kaggriculture environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Kaggle/kaggle-environments.git@d7729da06cc1382eb742d6980dc3180aa85caa28"

      - name: Verify packed main against Runtime v0.1 fixed10
        run: |
          python - <<'PY'
          import ast, hashlib, importlib.util, json, os, sys
          from pathlib import Path
          from kaggle_environments import make

          ROOT=Path(".").resolve()
          ORIGINAL=ROOT/"adaptive_replay_contract_runtime_v0.py"
          PACKED=ROOT/"main.py"
          OPPONENT=ROOT/"astra_flow_vendor"/"seyamalam_v21.py"
          SEEDS=[92802001,92802002,92802003,92802004,92802005,92802006,92802007,92802008,92802009,92802010]

          def plain(x):
              if isinstance(x, dict): return {str(k): plain(v) for k,v in x.items()}
              if isinstance(x,(list,tuple)): return [plain(v) for v in x]
              if isinstance(x,(str,int,float,bool)) or x is None: return x
              if hasattr(x,"items"): return {str(k):plain(v) for k,v in x.items()}
              if hasattr(x,"__iter__") and not isinstance(x,(str,bytes)): return [plain(v) for v in x]
              return x

          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec)
              sys.modules[name]=mod
              spec.loader.exec_module(mod)
              if hasattr(mod,"reset_agent"): mod.reset_agent()
              if hasattr(mod,"_runtime_reset_agent"): mod._runtime_reset_agent()
              return mod

          def shared(env,seat):
              return env._Environment__get_shared_state(seat)["observation"]

          def digest(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          def run(seed,path,tag):
              model=load(path,f"{tag}_{seed}_{os.getpid()}")
              opp=load(OPPONENT,f"opp_{tag}_{seed}_{os.getpid()}")
              env=make("kaggriculture",configuration={"seed":seed},debug=False)
              env.reset(num_agents=2)
              st=[]; ot=[]
              while not env.done:
                  o0=plain(shared(env,0)); o1=plain(shared(env,1))
                  a0=plain(model.agent(o0)); a1=plain(opp.agent(o1))
                  st.append(a0); ot.append(a1); env.step([a0,a1])
              final=plain(env.state[0].observation)
              return {
                "terminal_self":float(final["farms"][0]["money"]),
                "terminal_opponent":float(final["farms"][1]["money"]),
                "self_hash":digest(st),"opp_hash":digest(ot),
                "trigger_count":int(getattr(model,"trigger_count",0)),
                "last_guard_event":plain(getattr(model,"last_guard_event",None)),
                "last_contract_id":getattr(model,"last_contract_id",None),
              }

          tree=ast.parse(PACKED.read_text(encoding="utf-8"))
          public=[n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and not n.name.startswith("_")]
          assert public==["agent"], public

          cases=[]
          for seed in SEEDS:
              a=run(seed,ORIGINAL,"orig"); b=run(seed,PACKED,"packed")
              eq=(a==b)
              cases.append({"seed":seed,"equivalent":eq,"original":a,"packed":b})
              print("PACK_EQ",seed,eq,a["terminal_self"],b["terminal_self"])
              if not eq:
                  raise SystemExit(1)

          out={
            "schema":"adaptive-replay-runtime-v0.1-submission-equivalence",
            "source_commit":"3774523f0c93c17d9fb550b6924e918d8a697dd2",
            "n":len(cases),
            "equivalent":sum(c["equivalent"] for c in cases),
            "cases":cases
          }
          Path("submission_equivalence.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("PACK_EQ_SUMMARY",out["equivalent"],"/",out["n"])
          print("main.py bytes",PACKED.stat().st_size)
          PY

      - name: Package
        run: |
          tar -czf kaggriculture_adaptive_replay_runtime_v0_1_submission.tar.gz main.py
          tar -tzf kaggriculture_adaptive_replay_runtime_v0_1_submission.tar.gz
          sha256sum kaggriculture_adaptive_replay_runtime_v0_1_submission.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-adaptive-replay-runtime-v0.1-submission
          path: |
            kaggriculture_adaptive_replay_runtime_v0_1_submission.tar.gz
            submission_equivalence.json
          if-no-files-found: error
